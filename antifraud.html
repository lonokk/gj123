<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺東榮服防騙宣導</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #fdfbf7;
            font-family: "Microsoft JhengHei", sans-serif;
            color: #444;
            margin: 0; 
            padding: 20px;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 100%; 
            max-width: 450px; 
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.15); 
            margin-bottom: 20px;
            border-top: 6px solid #e74c3c; 
            text-align: center;
        }
        h2 { 
            color: #c0392b; 
            font-size: 24px; 
            margin-bottom: 20px; 
            font-weight: bold;
        }
        .info-card {
            background: linear-gradient(135deg, #fff5f5 0%, #ffebee 100%);
            border: 1px solid #f5c6cb;
            border-radius: 12px;
            padding: 25px 20px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.08);
        }
        .info-card h3 {
            color: #c0392b;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .info-card p {
            font-size: 14.5px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .action-btn {
            display: inline-block;
            background-color: #e74c3c;
            color: #fff;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(231,76,60,0.3);
            transition: 0.3s;
        }
        .action-btn:hover {
            background-color: #c0392b;
        }
        .back-btn { 
            display: inline-block; 
            text-align: center; 
            margin-top: 20px; 
            color: #888; 
            text-decoration: none; 
            font-size: 15px; 
            padding: 12px 25px; 
            border-radius: 30px; 
            background-color: #f0f0f0; 
            transition: 0.3s; 
        }
        .back-btn:hover { background-color: #555; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ 臺東榮服防騙宣導</h2>
        
        <div class="info-card">
            <h3>📢 守護荷包，慎防詐騙</h3>
            <p>
                近期詐騙手法層出不窮。為隨時掌握最新反詐騙資訊、各類防騙懶人包與警政署即時通報，建議直接前往官方專屬頻道查看最完整內容！
            </p>
            <a href="https://www.facebook.com/165bear" target="_blank" class="action-btn">
                👉 前往 165 全民防騙粉絲專頁
            </a>
        </div>

        <a href="index.html" class="back-btn">⬅️ 返回首頁</a>
    </div>

</body>
</html>
